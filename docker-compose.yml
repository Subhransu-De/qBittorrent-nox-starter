services:
  qbittorrent-nox:
    image: qbittorrentofficial/qbittorrent-nox:5.2.2-1
    pull_policy: always
    environment:
      - QBT_LEGAL_NOTICE=confirm
      - QBT_WEBUI_PORT=8080
    ports:
      - "8080:8080/tcp"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    tmpfs:
      - /tmp
    read_only: true
    stop_grace_period: 1800s
    restart: unless-stopped
